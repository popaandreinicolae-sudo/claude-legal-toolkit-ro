[project]
name = "legal-verificator-ro"
version = "0.1.0"
description = "MCP server for Romanian legal verification — CCR decisions, legislation, jurisprudence"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
legal-verificator-ro = "legal_verificator.server:main"
